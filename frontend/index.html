}
function paintDebate(box,d,pid){
  box.innerHTML='';
  box.append(sechead('01','辯論',
    d.n_debated!==undefined?`${d.n_debated} 個方向 · 漂移上限 ${d.drift_max} · 輪數上限 ${d.max_rounds}`:null));
  const rows=d.debates||[];
  if(!rows.length){ box.append(notYet('W8 唱反調')); }
  else{
    const stack=el('div',{class:'stack'});
    for(const r of rows){
      const detail=el('div',{hidden:true,style:'margin-top:16px'});
      let loaded=false;
      const btn=el('button',{class:'linkish',onclick:async()=>{
        detail.hidden=!detail.hidden;
        if(!detail.hidden&&!loaded){
          loaded=true;
          try{ busy('讀反對意見…');
            const s=await call('debate-state',{query:{idea_id:r.idea_id}});
            unbusy(); paintObjections(detail,s);
          }catch(e){ unbusy(); detail.append(emptyNote('讀不到這個方向的辯論內文。')); fail(e); }
        }
      }},'看反對意見');

      stack.append(el('div',{class:'row'},
        el('div',{style:'display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px'},
          el('span',{class:'meta'},'名次 '+(r.rank??'—')),
          r.code?el('span',{class:'meta'},'#'+r.code):null,
          el('span',{class:'chip '+(r.terminated?'warn':'calm')},r.terminated?'已終止':'可繼續'),
          el('span',{class:'chip '+(r.n_objections_open>0?'warn':'ok')},'未結案 '+fmt.int(r.n_objections_open))),
        el('h4',{style:'margin-bottom:8px'},r.title||'(無標題)'),
        el('div',{class:'meta',style:'display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px'},
          el('span',{},'輪數 '+fmt.int(r.n_rounds)),
          el('span',{},'漂移 '+(r.drift??'—'))),
        r.termination_reason?el('p',{class:'hint',style:'color:var(--wine);margin-bottom:10px'},r.termination_reason):null,
        btn, detail));
    }
    box.append(stack);
  }
  box.append(releaseBlock(pid,'④','放行之後會跑 W9 寫最終報告，會花錢。'));
}
const SEV={major:'warn',minor:'calm'};
const STATUS_TXT={unresolved:'未解決',resolved_by_evidence:'被證據解決',resolved_by_revision:'被改寫解決',withdrawn:'撤回'};
function paintObjections(box,s){
  box.innerHTML='';
  if(s.original_statement&&s.current_statement&&s.original_statement!==s.current_statement){
    box.append(el('div',{class:'card flat',style:'margin-bottom:16px'},
      field('原始問句',s.original_statement), field('目前問句',s.current_statement)));
  }
  const objs=s.objections||[];
  if(!objs.length){ box.append(emptyNote('這個方向沒有記錄到任何反對意見。')); return; }
  for(const o of objs){
    box.append(el('div',{class:'row'},
      el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px'},
        el('span',{class:'chip '+(SEV[o.severity]||'calm')},o.severity||'—'),
        el('span',{class:'chip calm'},o.axis||'—'),
        el('span',{class:'chip '+(o.citation_support==='strong'?'ok':'calm')},'引用 '+(o.citation_support||'—')),
        el('span',{class:'chip '+(o.status==='unresolved'?'warn':'ok')},STATUS_TXT[o.status]||o.status||'—'),
        el('span',{class:'meta'},'第 '+(o.round_no??'—')+' 輪 · 反駁分 '+(o.rebuttal_score??'—'))),
      el('p',{style:'font-size:13px;line-height:1.9'},o.statement||''),
      // The cited paper, when the objection has one. `引用 strong` without the
      // paper is a claim about evidence the reader cannot check.
      o.cited?el('p',{class:'meta',style:'margin-top:6px'},
        '引用：'+[o.cited.title,o.cited.year,o.cited.doi||o.cited.pmid]
          .filter(Boolean).join('　·　')):null,
      // The defender's answer. Shown because everything above it is a summary
      // OF this, and the score is one the defender gave its own attacker - so
      // a reader with only the score is being asked to trust it. Whether a
      // rebuttal holds up is the one judgement that cannot be delegated.
      o.rebuttal?el('div',{style:'margin-top:12px;padding-left:14px;border-left:3px solid var(--line,#00000022)'},
        el('p',{class:'eyebrow',style:'margin-bottom:6px'},'辯護方的回應'),
        el('p',{style:'font-size:13px;line-height:1.9'},o.rebuttal))
       :el('p',{class:'meta',style:'margin-top:10px'},'（辯護方沒有回應這一條）')));
  }
  if(s.n_evidence!==undefined)
    box.append(el('p',{class:'note',style:'margin-top:14px'},
      '這場辯論可以引用的論文有 '+fmt.int(s.n_evidence)+' 篇。沒有引用的反對意見不能結束辯論。'
      +'　反駁分是辯護方替攻擊自己的人打的，結構上偏向自己——4 分以上才准讓步，'
      +'所以「未解決 · 3 分」的意思是「你說得有道理但沒證據，我不改」。讀回應本身，不要只讀分數。'));
}

/* --- release ------------------------------------------------------------ */
// Two shapes, one block. Review point ④ releases the whole chain and has
// nothing to choose between, so it gets the plain node back. Review point ③
// passes a Set of ticked idea_ids and gets back `{node, sync}` - `sync` is
// called whenever a box is ticked, because the count and the money in this
// block are the feedback that makes ticking a decision rather than a gesture.
function releaseBlock(pid,point,warn,sel,nTotal){
  const picking=!!sel;
  const b=el('div',{class:'blocked',style:'margin-top:40px'});
  const line=el('p',{style:'margin-bottom:6px'});
  const money=el('p',{class:'hint on-dark',style:'margin-bottom:20px;color:#FFFFFFAA'});
  const go=el('button',{class:'pill solid',onclick:async()=>{
    const ids=picking?Array.from(sel):null;
    if(picking&&!ids.length){ toast('一個都沒勾。勾選至少一個方向才有東西可以往下跑。'); return; }
    go.disabled=true;
    try{ busy('放行…');
      // `params` is merged over what W6 handed forward, so sending idea_ids
      // here does not drop the tiers that stage worked out.
      const body={project_id:pid};
      if(ids) body.params={idea_ids:ids};
      const r=await call('release',{method:'POST',body:body});
      unbusy();
      // The API answers `resumed: false` with a reason when nothing was parked
      // or the budget is out. Reporting that as success is how a chain that
      // never restarted gets left for an hour before anyone checks.
      if(r&&r.resumed===false){ go.disabled=false;
        toast('沒有放行成功：'+((r&&r.reason)||'後端沒有說明原因。'),0); return; }
      toast(ids?('放行了 '+ids.length+' 個方向。接下來的階段會自己開始跑。')
               :'放行了。接下來的階段會自己開始跑。',0);
      setTimeout(()=>location.hash='#/p/'+pid+'/progress',900);
    }catch(e){ unbusy(); go.disabled=false; fail(e); }
  }},picking?'放行勾選的方向':'放行，繼續往下跑');

  b.append(
    el('p',{class:'eyebrow on-dark',style:'margin-bottom:8px'},'RELEASE — REVIEW '+point),
    el('h3',{style:'margin-bottom:12px'},picking?'要放行哪些':'要放行嗎'),
    picking?line:el('p',{style:'margin-bottom:20px'},warn),
    picking?money:null,
    go);

  if(!picking) return b;

  function sync(){
    const n=sel.size;
    line.innerHTML='';
    // What is still ahead differs by review point, and saying the wrong one is
    // worse than saying nothing: at ③b the novelty check has already run and
    // been paid for, so quoting its price again would make the remaining cost
    // look higher than it is and push somebody to tick fewer than they should.
    const after3b = point === '③b';
    const per = after3b ? (PER_DIRECTION.debate + PER_DIRECTION.report)
                        : PER_DIRECTION_TOTAL;
    line.append(n
      ? ('已勾選 '+n+' 個方向，共 '+nTotal+' 個。'
         + (after3b
            ? '只有勾選的會進到 W8 唱反調，然後是 W9 報告——新穎性已經全部驗過了，'
              +'沒勾的方向那份判定仍然留著，只是不會被拿去辯論。'
            : '只有勾選的會進到 W7 新穎性驗證，'
              +'然後一路到 W8 辯論與 W9 報告——沒勾的就停在這份分級板上。'))
      : ('還沒勾選任何方向。勾了哪些，就只有哪些往下跑。'));
    money.innerHTML='';
    money.append(n
      ? ('每個方向往下跑約 $'+per.toFixed(2)
         + (after3b
            ? '（W8 約 $'+PER_DIRECTION.debate.toFixed(2)
              +'、W9 約 $'+PER_DIRECTION.report.toFixed(2)+'）'
            : '（W7 約 $'+PER_DIRECTION.novelty.toFixed(2)
              +'、W8 約 $'+PER_DIRECTION.debate.toFixed(2)
              +'、W9 約 $'+PER_DIRECTION.report.toFixed(2)+'）')
         +'，'+n+' 個約 $'+(per*n).toFixed(2)+'。'
         +'這是估算——超過專案上限的話，每一段自己的預算護欄會在花錢之前擋下來。')
      : '　');
    go.disabled=!n;
  }
  return {node:b,sync:sync};
}

/* ===========================================================================
   ③b 審閱點三之二 — 挑要辯論的方向
   ===========================================================================
   The only screen where both halves of the evidence are on the table at once.

   Review point ③ asks which directions to carry forward while `scooped` is
   still unknown, because W7 runs afterwards. On 2026-09-10 that cost a full
   debate — about $0.40 — on a direction PubMed had already shown was done, and
   the person who ticked it had no way to know.

   So the cheap check runs on a generous selection at ③ ($0.066 a direction),
   and the expensive one is chosen here, with the verdicts in front of you.
   =========================================================================== */
const VERDICT_TXT = {
  scooped: '已經有人做過',
  incremental: '有前案，差異不大',
  adjacent: '鄰近但不同',
  no_prior_art: '沒找到前案',
};
const VERDICT_TONE = { scooped: 'bad', incremental: 'warn', adjacent: 'ok',
                       no_prior_art: 'ok' };

async function screenPick(pid) {
  setProject(pid); paintSteps(3);
  const box = el('div', {});
  view(hero({ tone: 'teal', mark: 'P', plate: 'Q',
      eyebrow: 'REVIEW ③b — PICK WHAT GETS ARGUED',
      title: '挑要辯論的方向',
      body: '分級和新穎性都在了，辯論還沒開始花錢。'
          + '新穎性一個 $0.066，辯論一個約 $0.40——這裡是把錢花在對的地方的機會。',
      vlabel: 'STATE 03b' }),
    shell(el('section', {}, box)), footer());

  try {
    busy('讀分級與新穎性…');
    const [fe, nv] = await Promise.all([
      call('feasibility', { query: { project_id: pid } }),
      call('novelty', { query: { project_id: pid } }),
    ]);
    unbusy();

    const board = fe.assessments || [];
    if (!board.length) { box.append(notYet('W6 可行性分級')); return; }

    const byId = {};
    ((nv.checks || nv.rows || nv.items) || []).forEach(c => {
      if (c && c.idea_id) byId[String(c.idea_id)] = c;
    });

    const sel = new Set();
    const rows = [];

    // Checked defaults to on for anything not scooped. A screen that starts
    // empty makes "I agree with what the machine found" cost the same number
    // of clicks as disagreeing with it, and the common case should be cheap.
    board.forEach(a => {
      const nvc = byId[String(a.idea_id)] || {};
      const v = (nvc.verdict || '').toLowerCase();
      const checked = Boolean(v) && v !== 'scooped';
      if (checked) sel.add(a.idea_id);

      const cb = el('input', { type: 'checkbox', ...(checked ? { checked: '' } : {}),
        onchange: e => { e.target.checked ? sel.add(a.idea_id) : sel.delete(a.idea_id); sync(); } });

      rows.push(el('label', { class: 'row', style: 'display:block;cursor:pointer' },
        el('div', { style: 'display:flex;gap:10px;align-items:flex-start' },
          el('div', { style: 'padding-top:2px' }, cb),
          el('div', { style: 'flex:1' },
            el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px' },
              el('span', { class: 'chip calm' }, String(a.code)),
              el('span', { class: 'chip ' + (a.tier === 'A' || a.tier === 'B' ? 'ok' : 'calm') },
                '資料 ' + (a.tier || '—')),
              el('span', { class: 'chip ' + (VERDICT_TONE[v] || 'calm') },
                v ? (VERDICT_TXT[v] || v) : '沒驗過'),
              // `rounds` is the stored blob, not a count - reading n_rounds
              // here showed nothing at all until it was checked against a real
              // response. The rounds live one level in.
              (nvc.rounds && nvc.rounds.rounds)
                ? el('span', { class: 'meta' }, nvc.rounds.rounds.length + ' 輪檢索')
                : null),
            el('p', { style: 'font-family:var(--cjk);font-size:14px;line-height:1.8' },
              a.title || ''),
            // The reason the verdict is what it is. A tag alone asks to be
            // trusted; the coverage note is what makes it checkable.
            nvc.coverage_limits
              ? el('p', { class: 'meta', style: 'margin-top:6px' },
                  String(nvc.coverage_limits).slice(0, 200))
              : null))));
    });

    box.append(sechead('01', '分級與新穎性', board.length + ' 個方向'),
      el('p', { class: 'hint', style: 'margin-bottom:18px' },
        '「已經有人做過」預設不勾。那是機械數出來的——符合這個方向詞組的論文'
        + '達到門檻——不是誰的意見。要推翻它，去辯論頁看它引用了哪幾篇。'),
      ...rows);

    const rb = releaseBlock(pid, '③b',
      '放行之後會跑 W8 唱反調，每個方向約 $0.40。', sel, board.length);
    box.append(rb.node);
    rb.sync();
  } catch (e) { unbusy(); fail(e); }
}

              const full=await call('report',{query:{report_id:r.id}});
              unbusy(); paintReportBody(body,full);

// The export route answers with a file and its own Content-Disposition, so the
// bytes are fetched with the key attached and handed to the browser as a blob.
// A plain link cannot carry the header.
async function download(report_id,format){
  try{
    busy('準備檔案…');
    const res=await fetch(`${CFG.api}/report-export?report_id=${encodeURIComponent(report_id)}&format=${format}`,
      {headers:{'X-Frontend-Key':getKey()}});
    if(!res.ok){ unbusy(); toast('下載失敗：'+res.status,0); return; }
    const blob=await res.blob(); unbusy();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='report-'+String(report_id).slice(0,8)+(format==='pdf'?'.pdf':'.md');
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ unbusy(); fail(e); }
}
// The eight sections in reading order, with the keys the API actually uses.
// Anything the server adds later that is not in this list still renders, at the
// end, under its own key - so a new section appears without editing this file.
const SECTIONS=[
  ['title','研究問句'], ['background','背景與現況'], ['method','方法設計'],
  ['novelty','新穎性查核'], ['feasibility','可行性與取得成本'],
  ['prework','動手前要先做的事'], ['objections','未解決的反對'],
  ['references','參考文獻']
];
function paintReportBody(box,full){
  box.innerHTML='';
  const rep=(full&&full.report)||full;
  if(!rep){ box.append(emptyNote('這一份沒有內文。')); return; }

  const meta=el('div',{class:'meta',style:'display:flex;gap:18px;flex-wrap:wrap;margin-bottom:22px'},
    rep.model?el('span',{},'寫手 '+rep.model):null,
    rep.tier?el('span',{},'分級 '+rep.tier):null,
    rep.rank!==null&&rep.rank!==undefined?el('span',{},'名次 '+rep.rank):null,
    el('span',{},fmt.date(rep.created_at)));
  box.append(meta);

  // Added by migration 018, so reports written before it carry null. Absent is
  // a real state here, not a bug - rendering an empty heading would suggest the
  // report has no caveats rather than that none were recorded.
  if(rep.novelty_verdict) box.append(el('div',{class:'card flat',style:'margin-bottom:18px'},
    field('新穎性判決',rep.novelty_verdict)));
  if(rep.caveats) box.append(el('div',{class:'card flat',style:'margin-bottom:18px'},
    field('但書',typeof rep.caveats==='string'?rep.caveats:JSON.stringify(rep.caveats,null,2))));
  if(rep.acquisition) box.append(el('div',{class:'card flat',style:'margin-bottom:18px'},
    field('要去弄的資料',typeof rep.acquisition==='string'?rep.acquisition:JSON.stringify(rep.acquisition,null,2))));

  const sec=rep.sections||{};
  const shown=new Set();
  const put=(key,label)=>{
    const v=sec[key]; if(v===null||v===undefined||v==='') return;
    shown.add(key);
    box.append(el('div',{style:'margin-bottom:26px'},
      el('p',{class:'eyebrow',style:'margin-bottom:7px'},label),
      el('p',{style:'font-size:13px;line-height:2;white-space:pre-wrap'},
        typeof v==='string'?v:JSON.stringify(v,null,2))));
  };
  SECTIONS.forEach(([k,l])=>put(k,l));
  Object.keys(sec).forEach(k=>{ if(!shown.has(k)) put(k,k); });
  if(!Object.keys(sec).length) box.append(emptyNote('這一份報告沒有任何段落內容。'));

  const cites=rep.citations||[];
  box.append(el('p',{class:'eyebrow',style:'margin:26px 0 8px'},'CITATIONS'));
  if(!cites.length) box.append(emptyNote('這一份沒有引用。引用只會來自實際檢索回傳的論文，所以 0 筆代表檢索沒有可用的來源，不是漏掉了。'));
  else{
    const st=el('div',{class:'stack'});
    for(const c of cites){
      const href=(c.links&&c.links.doi)||(c.doi?'https://doi.org/'+c.doi:null);
      st.append(el('div',{class:'row'},
        el('p',{style:'font-size:13px;line-height:1.8;margin-bottom:6px'},c.title||'(無標題)'),
        el('div',{class:'meta',style:'display:flex;gap:14px;flex-wrap:wrap'},
          c.year?el('span',{},String(c.year)):null,
          c.venue?el('span',{},c.venue):null,
          c.found_by?el('span',{},'來源 '+c.found_by):null,
          c.cross_validated?el('span',{class:'chip ok'},'交叉驗證'):null,
          href?el('a',{href,target:'_blank',rel:'noopener'},'DOI'):null),
        c.used_for?el('p',{class:'hint',style:'margin-top:6px'},'用在：'+c.used_for):null));
    }
    box.append(st);
  }
  if(rep.dropped) box.append(el('p',{class:'hint',style:'margin-top:14px;color:var(--wine)'},
    '有被丟掉的引用：'+(typeof rep.dropped==='string'?rep.dropped:JSON.stringify(rep.dropped))));
}

        el('div',{style:'display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px'},
          el('span',{class:'chip '+(r.verdict==='scooped'?'warn':r.verdict==='incremental'?'calm':'ok')},r.verdict||'—'),
          el('span',{class:'meta'},'新論文 '+fmt.int(r.n_new_papers)),
          el('span',{class:'meta'},fmt.date(r.checked_at))),
        r.coverage_limits?el('p',{class:'hint'},'涵蓋範圍：'+r.coverage_limits):null));
    }
    box.append(st);
  }catch(e){ unbusy(); box.append(emptyNote('讀不到監看紀錄。')); }
}

/* ===========================================================================
   router
   =========================================================================== */
function route(){
  if(!getKey()){ openGate(); return; }
  const h=location.hash||'#/';
  const m=h.match(/^#\/p\/([0-9a-f-]{8,})\/(tiers|debate|report|progress|concepts)/i);
  if(m){
    const [,pid,what]=m;
    if(what==='tiers') return screenTiers(pid);
    if(what==='pick') return screenPick(pid);
    if(what==='debate') return screenDebate(pid);
    if(what==='report') return screenReport(pid);
    // A project's concepts. Matched before the bare #/concepts below, which is
    // the draft being edited before any project exists - two screens, two
    // sources, and only this one survives a reload.
    if(what==='concepts') return screenProjectConcepts(pid);
    return screenProgress(pid);
  }
  if(h.startsWith('#/concepts')) return screenConcepts();
  return screenHome();
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash=b.dataset.go);
paintRail(getProject());
window.addEventListener('hashchange',route);
route();
</script>
